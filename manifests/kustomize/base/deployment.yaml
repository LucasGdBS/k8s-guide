apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: laboratorio
  labels:
    app: web
    aula: "14-kustomize"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.25
        ports:
        - containerPort: 80