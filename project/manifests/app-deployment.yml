apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: project
  labels:
    app: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
      annotations:
        prometheus.io/scrape: "true"       # habilita scraping para este pod
        prometheus.io/port: "8000"        # porta onde o app expõe métricas
        prometheus.io/path: "/metrics"    # endpoint de métricas
    spec:
      containers:
        - name: fastapi-app
          image: fastapi-app:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: postgres-secret
          resources:
            requests:
              cpu: "100m"      # reserva 0.1 vCPU para scheduling
              memory: "128Mi"
            limits:
              cpu: "250m"      # throttle acima de 0.25 vCPU
              memory: "256Mi"  # OOMKilled se ultrapassar
          startupProbe:        # dá tempo para a migration rodar antes de tudo
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 15  # 15 * 2s = 30s máximo para iniciar
            periodSeconds: 2
          readinessProbe:      # remove o pod do Service se o banco estiver inacessível
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:       # reinicia o container se o processo travar
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: project
  labels:
    app: app
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080