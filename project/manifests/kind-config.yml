# Configuração do cluster Kind com suporte a Ingress
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80   # mapeia porta 80 do node para porta 80 do host
        hostPort: 80
        protocol: TCP
      - containerPort: 443  # mapeia porta 443 do node para porta 443 do host
        hostPort: 443
        protocol: TCP